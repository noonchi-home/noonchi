<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">The WebXR round trip</title>
<desc id="desc">The Android phone sends its AR pose and camera frames to a Node.js gateway. Perception and World State feed the agent. A checked instruction returns to the phone. New evidence confirms the step and updates the dashboard.</desc>
<g font-family="Malgun Gothic, Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<rect x="72" y="54" width="8" height="67" rx="4" fill="#a50034" stroke="none" stroke-width="1"/>
<text x="105" y="105" text-anchor="start" font-size="51" font-weight="700" fill="#182431">The WebXR round trip</text>
<text x="105" y="151" text-anchor="start" font-size="26" font-weight="400" fill="#4e5c68">One cup-clearing step, from camera capture to confirmed placement.</text>
<rect x="498" y="188" width="936" height="681" rx="20" fill="#f4f7f9" stroke="#d8e1e6" stroke-width="1"/>
<text x="527" y="222" text-anchor="start" font-size="22" font-weight="700" fill="#21516b">NOONCHI server</text>
<text x="714" y="222" text-anchor="start" font-size="18" font-weight="400" fill="#425c69">Internal messages · MemoryBus by default / RedisBus with REDIS_URL</text>
<rect x="60" y="250" width="344" height="91" rx="13" fill="#f9edf1" stroke="#d9abb9" stroke-width="1"/>
<text x="232" y="286" text-anchor="middle" font-size="27" font-weight="700" fill="#1b2a37">Android phone</text>
<text x="232" y="320" text-anchor="middle" font-size="18" font-weight="400" fill="#475a65">WebXR · /phone/</text>
<line x1="232" y1="347" x2="232" y2="862" stroke="#a5b6be" stroke-width="2" stroke-dasharray="5 7"/>
<rect x="528" y="250" width="324" height="91" rx="13" fill="#ffffff" stroke="#cfdae0" stroke-width="1"/>
<text x="690" y="286" text-anchor="middle" font-size="27" font-weight="700" fill="#1b2a37">Phone gateway</text>
<text x="690" y="320" text-anchor="middle" font-size="18" font-weight="400" fill="#475a65">AR ↔ twin coordinates</text>
<line x1="690" y1="347" x2="690" y2="862" stroke="#a5b6be" stroke-width="2" stroke-dasharray="5 7"/>
<rect x="972" y="250" width="440" height="91" rx="13" fill="#ffffff" stroke="#cfdae0" stroke-width="1"/>
<text x="1192" y="286" text-anchor="middle" font-size="27" font-weight="700" fill="#1b2a37">Perception and action</text>
<text x="1192" y="320" text-anchor="middle" font-size="18" font-weight="400" fill="#475a65">YOLO / VLM · World State · PAM · Act</text>
<line x1="1192" y1="347" x2="1192" y2="862" stroke="#a5b6be" stroke-width="2" stroke-dasharray="5 7"/>
<rect x="1501" y="250" width="336" height="91" rx="13" fill="#f1f3f5" stroke="#cfdae0" stroke-width="1"/>
<text x="1669" y="286" text-anchor="middle" font-size="27" font-weight="700" fill="#1b2a37">Dashboard</text>
<text x="1669" y="320" text-anchor="middle" font-size="18" font-weight="400" fill="#475a65">3D twin · vision minimap · trace</text>
<line x1="1669" y1="347" x2="1669" y2="862" stroke="#a5b6be" stroke-width="2" stroke-dasharray="5 7"/>
<line x1="243" y1="392" x2="679" y2="392" stroke="#22567a" stroke-width="3"/>
<polygon points="679,392 666,385 666,399" fill="#22567a"/>
<text x="461" y="375" text-anchor="middle" font-size="21" font-weight="700" fill="#22567a">Pose, rotation, tracking, AR epoch</text>
<text x="461" y="424" text-anchor="middle" font-size="19" font-weight="400" fill="#495765">WSS /phone/events</text>
<line x1="243" y1="476" x2="679" y2="476" stroke="#22567a" stroke-width="3"/>
<polygon points="679,476 666,469 666,483" fill="#22567a"/>
<text x="461" y="459" text-anchor="middle" font-size="21" font-weight="700" fill="#22567a">Engine JPEG and projection</text>
<text x="461" y="508" text-anchor="middle" font-size="19" font-weight="400" fill="#495765">Timestamp of capture</text>
<line x1="701" y1="476" x2="1181" y2="476" stroke="#22567a" stroke-width="3"/>
<polygon points="1181,476 1168,469 1168,483" fill="#22567a"/>
<text x="941" y="459" text-anchor="middle" font-size="21" font-weight="700" fill="#22567a">Engine frame and twin camera pose</text>
<text x="941" y="508" text-anchor="middle" font-size="19" font-weight="400" fill="#495765">Local onEngine call</text>
<line x1="1203" y1="554" x2="1658" y2="554" stroke="#505963" stroke-width="3"/>
<polygon points="1658,554 1645,547 1645,561" fill="#505963"/>
<text x="1430.5" y="537" text-anchor="middle" font-size="21" font-weight="700" fill="#505963">World changes and decisions</text>
<text x="1430.5" y="586" text-anchor="middle" font-size="19" font-weight="400" fill="#495765">WS /events</text>
<line x1="1181" y1="633" x2="701" y2="633" stroke="#a50034" stroke-width="3"/>
<polygon points="701,633 714,626 714,640" fill="#a50034"/>
<text x="941" y="616" text-anchor="middle" font-size="21" font-weight="700" fill="#a50034">Checked step and twin target</text>
<text x="941" y="665" text-anchor="middle" font-size="19" font-weight="400" fill="#495765">Act → phone node</text>
<line x1="679" y1="633" x2="243" y2="633" stroke="#a50034" stroke-width="3"/>
<polygon points="243,633 256,626 256,640" fill="#a50034"/>
<text x="461" y="616" text-anchor="middle" font-size="21" font-weight="700" fill="#a50034">AR target · command.text · speak</text>
<text x="461" y="665" text-anchor="middle" font-size="19" font-weight="400" fill="#495765">Phone TTS · “Put the cup in the sink.”</text>
<line x1="243" y1="717" x2="679" y2="717" stroke="#276c64" stroke-width="3"/>
<polygon points="679,717 666,710 666,724" fill="#276c64"/>
<text x="461" y="700" text-anchor="middle" font-size="21" font-weight="700" fill="#276c64">New observation or a step reply</text>
<text x="461" y="749" text-anchor="middle" font-size="19" font-weight="400" fill="#495765">Phone camera, voice or button</text>
<line x1="701" y1="717" x2="1181" y2="717" stroke="#276c64" stroke-width="3"/>
<polygon points="1181,717 1168,710 1168,724" fill="#276c64"/>
<text x="941" y="700" text-anchor="middle" font-size="21" font-weight="700" fill="#276c64">Evidence or a scoped reply</text>
<text x="941" y="749" text-anchor="middle" font-size="19" font-weight="400" fill="#495765">Check the active plan and step</text>
<line x1="1203" y1="801" x2="1658" y2="801" stroke="#276c64" stroke-width="3"/>
<polygon points="1658,801 1645,794 1645,808" fill="#276c64"/>
<text x="1430.5" y="784" text-anchor="middle" font-size="21" font-weight="700" fill="#276c64">Placement confirmed</text>
<text x="1430.5" y="833" text-anchor="middle" font-size="19" font-weight="400" fill="#495765">Update the same execution row</text>
<line x1="72" y1="896" x2="1848" y2="896" stroke="#cbd5db" stroke-width="2"/>
<text x="79" y="940" text-anchor="start" font-size="23" font-weight="700" fill="#293f50">Phone coordinates</text>
<text x="79" y="979" text-anchor="start" font-size="20" font-weight="400" fill="#3c505f">A new AR origin invalidates the old transform. Direction guidance resumes after alignment.</text>
<text x="968" y="940" text-anchor="start" font-size="23" font-weight="700" fill="#293f50">Dashboard video</text>
<text x="968" y="979" text-anchor="start" font-size="17" font-weight="400" fill="#3c505f">/api/eye/video or /api/eye/stream carries the display feed. /events carries state and decisions.</text>
</g>
</svg>
