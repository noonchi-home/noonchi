<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>twin-home 스마트홈</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M4 15 16 4l12 11v13H4z%22 fill=%22%232f6fde%22/%3E%3Crect x=%2213%22 y=%2219%22 width=%226%22 height=%229%22 fill=%22%23fff%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>twin-home</h1>
      <span class="sub">Matter 가상 가전 · 에이전트 제어</span>
    </div>
    <div class="status">
      <span id="conn" class="badge off" role="status" aria-live="polite">연결 중…</span>
      <span id="hub" class="badge">허브 -</span>
      <span id="provider" class="badge">에이전트 -</span>
      <button type="button" id="twin-toggle" class="badge toggle" aria-pressed="true" aria-controls="twin-pane" hidden>3D 트윈</button>
      <span id="twin-missing" class="badge off" hidden>3D 트윈 없음</span>
      <label class="sim">
        <input type="checkbox" id="sim-toggle">
        <span>센서 시뮬레이션</span>
      </label>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="화면 고르기">
    <button type="button" role="tab" data-tab="devices" aria-selected="true">기기</button>
    <button type="button" role="tab" data-tab="twin" aria-selected="false">3D</button>
    <button type="button" role="tab" data-tab="chat" aria-selected="false">대화</button>
  </nav>

  <main class="layout" id="layout" data-tab="devices">
    <section class="devices" aria-label="기기">
      <div class="room-filter" id="room-filter" role="tablist" aria-label="방 고르기"></div>
      <div id="rooms" class="rooms"></div>
    </section>

    <section class="twin" id="twin-pane" aria-label="3D 트윈" hidden>
      <div class="twin-head">
        <h2>3D 트윈</h2>
        <span class="twin-note">채팅·카드로 바꾼 상태가 실시간으로 보여요</span>
        <a id="twin-open" class="ghost small" href="/twin/viewer/?live=auto" target="_blank" rel="noopener">새 창</a>
      </div>
      <div class="twin-body">
        <iframe id="twin-frame" title="3D 아파트 트윈" loading="lazy"></iframe>
        <p id="twin-msg" class="twin-msg">3D 트윈 불러오는 중…</p>
      </div>
    </section>

    <section class="chat" aria-label="에이전트 대화">
      <div class="chat-head">
        <h2>에이전트</h2>
        <button type="button" id="new-session" class="ghost small">새 대화</button>
      </div>
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <div id="suggestions" class="suggestions"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" placeholder="예: 거실 불 켜고 TV 꺼줘" aria-label="에이전트에게 보낼 말" maxlength="2000">
        <button type="submit" id="send">보내기</button>
      </form>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
