<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="figure-title figure-description" lang="en" font-family="'Segoe UI',Arial,sans-serif">
  <title id="figure-title">The Android app and the NOONCHI server</title>
  <desc id="figure-description">The native app pairs with the hub using the dashboard QR. Turning on CLOiD opens WebXR in Chrome on the same phone. Images and pose go to the server. Checked steps return to the phone. The server controls appliances and reports progress to the dashboard. Reference photos can be uploaded to S3, and structured events are recorded in SQLite.</desc>
  <defs>
    <marker id="arrow-wire" viewBox="0 0 12 12" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" refX="10" refY="6" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#526778" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 12 12" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" refX="10" refY="6" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#a50034" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" rx="0" fill="white" stroke="none" stroke-width="1.8" />
  <text x="64" y="93" font-size="53" font-weight="700" fill="#192633" text-anchor="start">The Android app and the NOONCHI server</text>
  <text x="67" y="145" font-size="25" font-weight="400" fill="#425565" text-anchor="start">The phone sends the scene. The server selects the next action, guides the person or sends a command to an appliance.</text>
