<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>twin-home 클로이드의 뇌</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M4 15 16 4l12 11v13H4z%22 fill=%22%232f6fde%22/%3E%3Crect x=%2213%22 y=%2219%22 width=%226%22 height=%229%22 fill=%22%23fff%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>twin-home</h1>
      <span class="sub">트윈 · 클로이드의 눈 · 추론 과정</span>
    </div>
    <div class="status">
      <span id="conn" class="badge off" role="status" aria-live="polite">연결 중…</span>
      <span id="home" class="badge" title="설정에서 고른 집(twin-studio homes.json)">집 -</span>
      <span id="hub" class="badge">허브 -</span>
      <span id="provider" class="badge">에이전트 -</span>
      <button type="button" id="cards-toggle" class="badge toggle" aria-pressed="false" aria-controls="devices-pane" title="Matter 속성·밝기·온도·센서 시뮬레이션을 직접 보는 카드">기기 카드</button>
      <span id="twin-missing" class="badge off" hidden>3D 트윈 없음</span>
      <a id="setup-link" class="badge link" href="/setup/" title="집·가전 신호 출처·폰 기준점·배치 보정">설정 다시 하기</a>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="화면 고르기">
    <button type="button" role="tab" data-tab="twin" aria-selected="true">3D 트윈</button>
    <button type="button" role="tab" data-tab="eye" aria-selected="false">클로이드의 눈</button>
    <button type="button" role="tab" data-tab="log" aria-selected="false">추론 과정</button>
  </nav>

  <main class="layout" id="layout" data-tab="twin">
    <section class="twin" id="twin-pane" aria-label="3D 트윈">
      <div class="pane-head">
        <h2>3D 트윈</h2>
        <span class="note">클로이드가 한 일의 결과가 여기서 보여요</span>
        <a id="twin-open" class="ghost small" href="/twin/viewer/?live=auto" target="_blank" rel="noopener">새 창</a>
      </div>
      <div class="twin-body">
        <iframe id="twin-frame" title="3D 집 트윈"></iframe>
        <p id="twin-msg" class="twin-msg">3D 트윈 불러오는 중…</p>
      </div>
    </section>

    <section class="eye-pane" id="eye-pane" aria-label="클로이드의 눈">
      <div class="pane-head">
        <h2>클로이드의 눈</h2>
        <span class="note">폰 카메라 실시간 · 엔진 입력 아님</span>
      </div>
      <div class="eye-body">
        <figure id="eye" class="eye" hidden>
          <img id="eye-live" alt="클로이드의 눈: 폰 카메라 실시간 화면">
          <figcaption id="eye-caption">클로이드의 눈 · 실시간 · 엔진 입력 아님</figcaption>
        </figure>
        <p id="eye-empty" class="eye-empty">폰이 연결되지 않았어요.</p>
      </div>
    </section>

    <section class="chat" id="log-pane" aria-label="추론 과정">
      <div class="pane-head">
        <h2>추론 과정</h2>
        <span class="note">요청마다 클로이드가 거친 단계</span>
        <button type="button" id="new-session" class="ghost small">새 대화</button>
      </div>
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <div id="suggestions" class="suggestions"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" placeholder="클로이드에게 요청하기" aria-label="클로이드에게 보낼 말" maxlength="2000">
        <button type="submit" id="send">보내기</button>
      </form>
    </section>

    <aside class="devices" id="devices-pane" aria-label="기기 카드" hidden>
      <div class="pane-head">
        <h2>기기 카드</h2>
        <label class="sim">
          <input type="checkbox" id="sim-toggle">
          <span>센서 시뮬레이션</span>
        </label>
        <button type="button" id="cards-close" class="ghost small" aria-label="기기 카드 닫기">닫기</button>
      </div>
      <div class="room-filter" id="room-filter" role="tablist" aria-label="방 고르기"></div>
      <div id="rooms" class="rooms"></div>
    </aside>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
