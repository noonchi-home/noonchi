<!doctype html>
<html lang="ko" data-surface="phone">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>클로이드의 눈 · NOONCHI</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="fonts/noto-sans-kr.css" />
<link rel="stylesheet" href="phone.css" />
</head>
<body>
<main id="intro">
  <img class="mascot" src="brand/mascot@1x.webp" alt="" width="55" height="96">
  <h1>클로이드의 눈</h1>
  <p id="support">AR 지원을 확인하는 중…</p>
  <ol>
    <li id="align-help"><span id="anchor-names">방 모서리</span> 바닥에 차례로 조준점을 맞추고 <b>지점 기록</b>을 눌러요</li>
    <li>물건 아래 바닥을 조준하고 <b>말하기</b>를 누른 채 "냉장고 여기로"라고 말해요</li>
  </ol>
  <button id="start" type="button" disabled>AR 시작</button>
  <section id="talk" class="talk" aria-label="클로이드와 대화">
    <p id="reply" class="reply" role="status" aria-live="polite" hidden></p>
    <div id="pending" class="pending"></div>
    <div class="talk-row">
      <button id="talk-btn" type="button" class="talk-btn" hidden>🎙 누르고 말하기</button>
      <form id="talk-form" class="talk-form" autocomplete="off">
        <input id="talk-input" type="text" maxlength="500" placeholder="예: TV 켜줘 / 냉장고 위치 여기로 맞춰줘" aria-label="클로이드에게 할 말" />
        <button type="submit">보내기</button>
      </form>
    </div>
  </section>
</main>
<div id="overlay" hidden>
  <div id="reticle" aria-hidden="true"></div>
  <div id="focus-layer" aria-hidden="true"></div>
  <!-- 세로 촬영 기준: 위 얇은 상태 줄, 아래 큰 버튼 줄, 나머지는 ⋯ 메뉴(가로로 돌리면 버튼이 오른쪽으로 간다) -->
  <div class="topbar">
    <span id="status" role="status">바닥을 비춰 주세요</span>
    <span id="perf" class="perf" title="최근 2초 동안 대시보드로 보낸 화면 장 수">0 fps</span>
    <button id="more" type="button" aria-expanded="false" aria-controls="menu" aria-label="메뉴">⋯</button>
  </div>
  <p id="brain-line" class="brain-line" role="status" aria-live="polite" hidden></p>
  <p id="brain-request" class="brain-request" role="alert" hidden></p>
  <div id="brain-action" class="brain-action" hidden>
    <p class="brain-action-text"><span class="tag">모의</span> <b id="brain-action-text"></b></p>
    <p id="brain-action-would" class="brain-action-would"></p>
    <div id="brain-action-choices" class="brain-action-choices"></div>
  </div>
  <div id="anchors" class="anchors"></div>
  <div class="side">
    <button id="ar-talk" type="button" class="talk-btn" aria-label="누르고 말하기">🎙<span>말하기</span></button>
    <button id="photo" type="button" aria-label="사진 찍기">📷<span>사진</span></button>
    <button id="stop" type="button" aria-label="끝내기">■<span>끝내기</span></button>
  </div>
  <div id="pending-slot" class="pending-slot"></div>
  <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
  <div id="menu" class="menu" hidden>
    <div id="menu-talk"></div>
    <button id="reset" type="button">기준점 다시 찍기</button>
    <pre id="perf-detail" class="perf-detail">측정 전</pre>
    <button id="menu-close" type="button">닫기</button>
  </div>
</div>
<script type="module" src="phone.js"></script>
</body>
</html>
