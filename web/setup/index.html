<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>twin-home 설정</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M4 15 16 4l12 11v13H4z%22 fill=%22%232f6fde%22/%3E%3Crect x=%2213%22 y=%2219%22 width=%226%22 height=%229%22 fill=%22%23fff%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/setup/setup.css">
</head>
<body class="setup">
  <header class="top">
    <div class="brand">
      <h1>twin-home 설정</h1>
    </div>
    <ol class="wiz-steps" id="steps" aria-label="설정 단계">
      <li data-step="home"><b>1</b> 집 고르기</li>
      <li data-step="devices"><b>2</b> 가전 선택</li>
      <li data-step="position"><b>3</b> 위치 동기화</li>
    </ol>
  </header>

  <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>

  <main class="step-body">
    <section id="step-home" class="wiz" aria-labelledby="h-home" hidden>
      <h2 id="h-home">어느 집을 쓸까요?</h2>
      <div id="home-list" class="home-list" role="radiogroup" aria-labelledby="h-home"></div>
      <div class="wiz-actions">
        <button type="button" id="home-next" class="primary">다음</button>
      </div>
    </section>

    <section id="step-devices" class="wiz" aria-labelledby="h-devices" hidden>
      <h2 id="h-devices">어떤 가전의 상태를 읽을까요?</h2>
      <div class="device-search">
        <input id="device-search" type="search" placeholder="가전이나 방 이름으로 검색" aria-label="가전 검색" aria-controls="device-results" autocomplete="off">
        <div id="room-chips" class="room-chips" aria-label="방으로 찾기"></div>
        <ul id="device-results" class="device-results" aria-label="검색 결과" hidden></ul>
      </div>
      <div class="bulk">
        <span id="device-count" class="badge"></span>
        <button type="button" class="small ghost" id="all-none">모두 빼기</button>
      </div>
      <div id="device-list" class="device-picked" aria-label="추가한 가전"></div>
      <div class="wiz-actions">
        <button type="button" id="devices-back">이전</button>
        <button type="button" id="devices-next" class="primary">다음</button>
      </div>
    </section>

    <section id="step-position" class="wiz" aria-labelledby="h-position" hidden>
      <h2 id="h-position">폰과 트윈의 위치를 맞춰요</h2>
      <div class="position-grid">
        <div class="twin-box">
          <iframe id="twin-frame" title="3D 집 트윈"></iframe>
          <p id="twin-msg" class="twin-msg">3D 트윈 불러오는 중…</p>
        </div>
        <div class="side">
          <!-- 폰 기준점: 3D에서 벽 두 곳을 고르면 폰이 실제 그 벽 바로 아래 바닥을 조준해 수평을 맞춘다(높이는 눈높이 고정) -->
          <section id="touch-panel" class="touch-panel box" aria-label="폰 기준점" hidden>
            <h3>폰 기준점 A·B</h3>
            <div class="touch-row">
              <b class="touch-id a">A</b>
              <input id="touch-label-A" type="text" maxlength="40" placeholder="예: 거실 창 오른쪽 벽" aria-label="A 지점 이름">
              <button type="button" id="touch-pick-A" class="small">3D에서 고르기</button>
              <span id="touch-pos-A" class="touch-pos">미지정</span>
            </div>
            <div class="touch-row">
              <b class="touch-id b">B</b>
              <input id="touch-label-B" type="text" maxlength="40" placeholder="예: 반대편 벽" aria-label="B 지점 이름">
              <button type="button" id="touch-pick-B" class="small">3D에서 고르기</button>
              <span id="touch-pos-B" class="touch-pos">미지정</span>
            </div>
            <p id="touch-info" class="touch-info" role="status" aria-live="polite">멀리 떨어진 두 벽을 고르세요.</p>
            <div class="touch-actions">
              <button type="button" id="touch-cancel" class="small" hidden>고르기 취소</button>
              <button type="button" id="touch-save">저장</button>
              <button type="button" id="touch-clear" class="ghost small">지우기</button>
            </div>
          </section>
          <section id="layout-box" class="box" aria-label="배치 보정" hidden>
            <h3>배치 보정</h3>
            <p><span id="layout-state" class="badge">보정 없음</span></p>
            <div class="touch-actions">
              <button type="button" id="layout-reset" class="ghost small">되돌리기</button>
              <button type="button" id="layout-save">저장</button>
            </div>
          </section>
          <section id="phone-box" class="box" aria-label="폰 연결">
            <h3>폰</h3>
            <p class="touch-info" id="phone-help">폰 서버가 꺼져 있어요.</p>
            <ul id="phone-urls" class="phone-urls"></ul>
          </section>
        </div>
      </div>
      <div class="wiz-actions">
        <button type="button" id="position-back">이전</button>
        <button type="button" id="position-done" class="primary">건너뛰고 대시보드로</button>
      </div>
    </section>
  </main>

  <script type="module" src="/setup/setup.js"></script>
</body>
</html>
